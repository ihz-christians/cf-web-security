name: container

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lokales Image für den Smoke Test bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: cf-pentest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Werkzeugaufrufe prüfen
        run: |
          docker run --rm cf-pentest:ci bash -lc '
            set -e
            echo "[+] Go-Werkzeuge prüfen..."
            subfinder -version
            dnsx -version
            httpx -version
            ffuf -V
            nuclei -version
            gau --version
            dalfox version
            kr --help >/dev/null
            echo "[+] Rust-Werkzeuge prüfen..."
            feroxbuster -V
            rustscan -V
            echo "[+] Python- und Node.js-Werkzeuge prüfen..."
            python3 -V
            arjun -h >/dev/null
            jwt_tool -h >/dev/null
            h2csmuggler -h >/dev/null
            semgrep --version
            testssl.sh --help >/dev/null
            retire --version
            echo "[+] Alle Sicherheitswerkzeuge wurden erfolgreich aufgerufen."
          '

      - name: Image für mehrere Architekturen bauen und veröffentlichen
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cf-pentest:latest
            ghcr.io/${{ github.repository_owner }}/cf-pentest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


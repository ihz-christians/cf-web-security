name: container

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: cf-pentest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm cf-pentest:ci bash -lc '
            set -e
            echo "[+] Verifying Go tools..."
            subfinder -version
            dnsx -version
            httpx -version
            ffuf -V
            nuclei -version
            gau -version
            dalfox version
            kr --help >/dev/null
            echo "[+] Verifying Rust tools..."
            feroxbuster -V
            rustscan -V
            echo "[+] Verifying Python & Node tools..."
            python3 -V
            arjun -h >/dev/null
            jwt_tool -h >/dev/null
            h2csmuggler -h >/dev/null
            semgrep --version
            testssl.sh --help >/dev/null
            retire --version
            echo "[+] All security tools verified successfully!"
          '

      - name: Build & Push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cf-pentest:latest
            ghcr.io/${{ github.repository_owner }}/cf-pentest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


